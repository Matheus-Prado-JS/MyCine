<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyCine</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Background -->
  <div class="background-overlay"></div>

  <!-- Header -->
  <header class="header">

    <div class="logo">
      MyCine
    </div>

    <nav class="nav">
      <a href="#">Início</a>
      <a href="#">Filmes</a>
      <a href="#">Séries</a>
      <a href="#">Minha Lista</a>
    </nav>

    <div class="profile">
      <img src="https://i.imgur.com/2DhmtJ4.png" alt="Perfil">
    </div>

  </header>

  <!-- HERO -->
  <main class="hero">

    <section class="recommended-container">

      <!-- CARD PRINCIPAL -->
      <div class="main-card" id="mainCard">

        <div class="main-overlay"></div>

        <div class="main-content">

          <span class="platform" id="platform">
            HBO MAX
          </span>

          <h1 id="title">
            Euphoria
          </h1>

          <p id="description">
            Um grupo de adolescentes enfrenta relações, traumas,
            vícios e descobertas enquanto tentam encontrar seu lugar no mundo.
          </p>

          <div class="info">

            <span id="genre">Drama</span>
            <span>•</span>

            <span id="age">18+</span>
            <span>•</span>

            <span id="rating">IMDb 8.3</span>

          </div>

            <button id="watchButton">
            Assistir Agora
            </button>

        </div>

      </div>

      <!-- LATERAIS -->
      <div class="side-cards" id="sideCards">
      </div>

    </section>
    <!-- STREAMINGS -->

<section class="streamings-section">

  <div class="streaming-grid">

    <!-- Netflix -->
    <button class="streaming-btn netflix">
      <img src="imgs/logos/netflix.png" alt="Netflix">
    </button>

    <!-- Disney -->
    <button class="streaming-btn disney">
      <img src="imgs/logos/disney.png" alt="Disney+">
    </button>

    <!-- HBO -->
    <button class="streaming-btn hbo">
      <img src="imgs/logos/hbo.png" alt="HBO Max">
    </button>

    <!-- Apple -->
    <button class="streaming-btn apple">
      <img src="imgs/logos/apple.png" alt="Apple TV">
    </button>

    <!-- Prime -->
    <button class="streaming-btn prime">
      <img src="imgs/logos/prime.png" alt="Prime Video">
    </button>

    <!-- Paramount -->
    <button class="streaming-btn paramount">
      <img src="imgs/logos/paramount.png" alt="Paramount+">
    </button>

    <!-- Universal -->
    <button class="streaming-btn universal">
      <img src="imgs/logos/universal.png" alt="Universal+">
    </button>

  </div>

</section>

    <!-- Próximas Seções -->
    <section class="section-placeholder">
      <h2>Seção 1</h2>
    </section>

    <section class="section-placeholder">
      <h2>Seção 2</h2>
    </section>

    <section class="section-placeholder">
      <h2>Seção 3</h2>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
